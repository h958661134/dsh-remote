name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: gateway (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18.x', '20.x', '22.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: syntax check
        run: |
          for file in gateway/*.mjs gateway/ui/*.js plugin/*.js desktop/*.js; do
            node --check "$file"
          done
      - name: cli smoke test
        run: |
          node gateway/server.mjs --version
          node gateway/server.mjs --help
      - name: config tool smoke test
        run: |
          cd gateway
          node admin.mjs init
          node admin.mjs show

  python:
    name: page generators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install qrcode pillow
      - name: compile
        run: |
          python -m py_compile scripts/make-page.py scripts/make-qr.py
      - name: render a page
        run: |
          cd scripts
          python make-qr.py /tmp/qr.png
          test -s /tmp/qr.png

  powershell:
    name: windows scripts parse
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: parse all PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Host "FAIL $($_.Name): $($errors[0].Message)"
              $failed = $true
            } else {
              Write-Host "OK   $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

# VPS example: nginx TLS reverse proxy in front of the gateway.
#
# Put the gateway on the VPS (or expose it there with frp), then:
#   nginx -t && systemctl reload nginx
# and set gateway/config.json "publicUrl": "https://dsh.example.com"
#
# WebSocket upgrade and unbuffered streaming are required — the GUI keeps a
# long-lived stream to /api/remote.mux.

server {
    listen 443 ssl http2;
    server_name dsh.example.com;

    ssl_certificate     /etc/letsencrypt/live/dsh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dsh.example.com/privkey.pem;

    client_max_body_size 512m;   # attachments / uploads

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
